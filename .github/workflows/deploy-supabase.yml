name: Deploy Supabase production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://nnh18.github.io/Namecard/' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COMPANY_RESEARCH_MODEL: ${{ vars.COMPANY_RESEARCH_MODEL || 'gpt-5-mini' }}
      RESEARCH_RATE_LIMIT_PER_HOUR: ${{ vars.RESEARCH_RATE_LIMIT_PER_HOUR || '10' }}
      RESOLVER_RATE_LIMIT_PER_HOUR: ${{ vars.RESOLVER_RATE_LIMIT_PER_HOUR || '10' }}
      RESEARCH_CACHE_DAYS: ${{ vars.RESEARCH_CACHE_DAYS || '30' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v2
        with:
          version: 2.117.0
          github-token: ${{ github.token }}
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing production secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing production secret SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing production secret OPENAI_API_KEY"; exit 1; }
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]] || { echo "SUPABASE_PROJECT_ID must be a 20-letter project ref"; exit 1; }
          [[ "$PUBLIC_APP_URL" =~ ^https:// ]] || { echo "PUBLIC_APP_URL must be an HTTPS URL"; exit 1; }
      - name: Verify production Auth and SMTP
        run: node scripts/verify-production-auth-config.js
      - name: Link project and apply migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all
      - name: Configure Edge Function secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/bcard-edge.env"
          trap 'rm -f "$secrets_file"' EXIT
          {
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'COMPANY_RESEARCH_MODEL=%s\n' "$COMPANY_RESEARCH_MODEL"
            printf 'RESEARCH_RATE_LIMIT_PER_HOUR=%s\n' "$RESEARCH_RATE_LIMIT_PER_HOUR"
            printf 'RESOLVER_RATE_LIMIT_PER_HOUR=%s\n' "$RESOLVER_RATE_LIMIT_PER_HOUR"
            printf 'RESEARCH_CACHE_DAYS=%s\n' "$RESEARCH_CACHE_DAYS"
          } > "$secrets_file"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" --env-file "$secrets_file"
      - name: Deploy Edge Functions
        run: supabase functions deploy company-resolver company-research --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Verify linked deployment
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID"
